name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and dev deps
        run: pip install -e ".[dev]"
      - name: Verify docs and OpenAPI stubs
        run: |
          test -f README.md
          test -f docs/ARCHITECTURE.md
          python -c "import yaml; yaml.safe_load(open('protocols/openapi/coordinator-gateway.yaml'))"
          python -c "import yaml; yaml.safe_load(open('protocols/zdl/v1/control.openapi.yaml'))"
      - name: Run tests
        run: pytest tests -q --tb=short
