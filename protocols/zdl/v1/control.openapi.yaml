openapi: 3.1.0
info:
  title: ZDLI Control Plane v0.1
  version: 0.1.0
paths:
  /zdl/v1/workers/register:
    post:
      summary: Register or update an edge worker
      security:
        - bearerAuth: []
  /zdl/v1/workers/{worker_id}/heartbeat:
    post:
      summary: Worker heartbeat
      security:
        - bearerAuth: []
  /zdl/v1/graphs/{logical_model_id}:
    put:
      summary: Upsert model shard graph
      security:
        - bearerAuth: []
    get:
      summary: Get model shard graph
      security:
        - bearerAuth: []
  /zdl/v1/sessions:
    post:
      summary: Create inference session (returns ingress OpenAI base URL)
      security:
        - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
